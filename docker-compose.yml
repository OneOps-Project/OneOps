version: "3.8"

services:
  db:
    image: postgres:15
    container_name: postgres_etctha
    restart: always
    environment:
      POSTGRES_USER: etctha
      POSTGRES_PASSWORD: etctha_dev
      POSTGRES_DB: etctha
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
